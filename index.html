<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <title>Picture Element</title>
</head>
    <body>
        <section class="grid-con center-grid-con">
            <h2 class="hidden">London, UK</h2>
            <picture class="col-start-2 col-end-4 m-col-span-full">
                <source srcset="images/london.jpg" media="(min-width: 768px)">
                <img src="images/london-small.jpg" alt="London, UK at night">
            </picture>
        </section>
        <section class="grid-con center-grid-con">
            <h2 class="hidden">Paris</h2>
            <picture class="col-start-2 col-end-4 m-col-start-4 m-col-end-8">
                <img src="images/paris.jpg" alt="Paris' Eiffel Tower">
            </picture>
        </section>
        <section class="grid-con center-grid-con">
            <h2 class="hidden">New York</h2>
            <picture class="col-start-2 col-end-4 m-col-span-full">
             <source srcset="images/new_york_odyza5_c_scale,w_1200.jpg" media="(min-width: 412px)">
            <img src="images/new_york_odyza5_c_scale,w_400.jpg" alt="New York at night">  
            </picture>
        </section>
        <script src="js/main.js"></script>   
    </body>
</html>
